<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الملف الشخصي — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="ملفك الشخصي على خوارزمي."></head><body><div id="siteHeader"></div><main class="page"><div class="wrap"><div class="profile-grid"><aside class="card profile-card"><div class="profile-avatar" id="profileAvatar">خ</div><h2 id="profileName">زائر</h2><p class="muted">طالب علوم حاسب</p><div class="badge-row"><span class="tag accent" id="profileLevel">Lv. 1</span><span class="tag teal" id="profileXp">+0 XP</span></div><div style="margin-top:18px"><a class="btn btn-primary" href="dashboard.html">لوحة التحكم</a></div></aside><section><div class="card"><h2>رحلتي</h2><div class="activity" id="profilePaths"></div></div><div class="card" style="margin-top:16px"><h2>النشاط الأخير</h2><div class="activity" id="profileRecent"></div></div></section></div></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const E=KW.esc,profileAvatar=document.getElementById('profileAvatar'),profileName=document.getElementById('profileName'),profileLevel=document.getElementById('profileLevel'),profileXp=document.getElementById('profileXp'),profilePaths=document.getElementById('profilePaths'),profileRecent=document.getElementById('profileRecent');if(KW.requireAuth()){profileName.textContent=KW.user.name;profileAvatar.textContent=KW.user.name[0];
KW.api.getSummary().then(s=>{profileLevel.textContent='Lv. '+(+s.level);profileXp.textContent='+'+(+s.xp)+' XP';
profilePaths.innerHTML=(s.paths||[]).map(p=>`<div class="activity-item"><span>${E(p.title)}</span><strong>${+p.progress||0}%</strong></div>`).join('')||'<p class="muted">لسه ما بدأتش مسار.</p>';
profileRecent.innerHTML=(s.recent||[]).map(r=>`<div class="activity-item"><span>${E(r.text)}</span><span class="muted">${E(KW.ago(r.at))}</span></div>`).join('')||'<p class="muted">لسه مفيش نشاط.</p>'}).catch(e=>{profilePaths.textContent=profileRecent.textContent=e.message})}</script></body></html>
