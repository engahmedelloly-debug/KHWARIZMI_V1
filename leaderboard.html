<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتصدرين — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="المتصدرون على منصة خوارزمي."></head><body><div id="siteHeader"></div><main class="page"><div class="wrap"><div class="page-title"><h1>لوحة المتصدرين</h1><p>XP من التعلم والتحديات.</p></div><div class="card"><div class="activity" id="lbList"></div></div></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const E=KW.esc,lbList=document.getElementById('lbList');KW.view(lbList,()=>KW.api.getLeaderboard(),l=>l.map(r=>`<div class="activity-item"><strong>${['🥇','🥈','🥉'][r.rank-1]||''} ${String(r.rank).padStart(2,'0')} · ${E(r.name)}</strong><span class="mono">${+r.xp} XP</span></div>`).join('')||'<p class="muted">لسه مفيش متصدرين.</p>')</script></body></html>
