<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المسارات — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="تخصصات ومسارات علوم الحاسب والبيانات."></head><body><div id="siteHeader"></div><main class="page"><div class="wrap"><div class="page-title"><h1>المسارات التعليمية</h1><p>بدل ما تبدأ من نص الطريق، خوارزمي يرتبلك الطريق خطوة بخطوة.</p></div><div class="toolbar"><input id="pathSearch" class="input search" placeholder="ابحث عن تخصص أو مجال..."><select id="pathLevel" class="select" style="max-width:190px"><option value="">كل المستويات</option><option>أساسي → متقدم</option><option>متوسط</option></select></div><div class="grid" id="pathsGrid"></div></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const pathsGrid=document.getElementById('pathsGrid'),pathSearch=document.getElementById('pathSearch'),pathLevel=document.getElementById('pathLevel');let t;function draw(){KW.view(pathsGrid,()=>KW.api.getPaths({q:pathSearch.value.trim(),level:pathLevel.value}),l=>KW_RENDER.pathCards(l,true))}
pathSearch.oninput=()=>{clearTimeout(t);t=setTimeout(draw,250)};pathLevel.onchange=draw;draw()</script></body></html>
