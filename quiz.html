<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كويز — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="حل كويز واجمع XP."></head><body><div id="siteHeader"></div><main class="page"><div class="wrap quiz-shell"><div class="page-title"><span class="tag accent">كويز</span><h1 id="quizTitle"></h1><p>اختار الإجابة الصح وكمّل لحد آخر سؤال.</p></div><div class="question-card"><div class="quiz-progress"><span id="qCount">1 / 3</span><span id="score">0 XP</span></div><div class="progress"><span id="qBar" style="width:33%"></span></div><h2 id="question"></h2><div class="answers" id="answers"></div><p id="quizMsg" class="muted"></p></div></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const E=KW.esc,quizTitle=document.getElementById('quizTitle'),qCount=document.getElementById('qCount'),score=document.getElementById('score'),qBar=document.getElementById('qBar'),question=document.getElementById('question'),answers=document.getElementById('answers'),quizMsg=document.getElementById('quizMsg');const id=new URLSearchParams(location.search).get('id');let quiz,i=0,correct=0,picked=[];
KW.api.getQuiz(id).then(q=>{quiz=q;quizTitle.textContent=q.title;render()}).catch(e=>{question.textContent=e.message;qCount.textContent='';answers.innerHTML='<a class="btn btn-primary" href="quizzes.html">رجوع للكويزات</a>'});
function render(){const n=quiz.questions.length;if(i>=n)return finish();const x=quiz.questions[i];qCount.textContent=(i+1)+' / '+n;qBar.style.width=((i+1)/n*100)+'%';question.textContent=x.text;answers.innerHTML=x.options.map((a,k)=>`<button class="answer" data-n="${k}">${E(a)}</button>`).join('');KW.$$('.answer').forEach(b=>b.onclick=()=>pick(+b.dataset.n))}
async function pick(k){const bs=KW.$$('.answer');bs.forEach(z=>z.disabled=true);picked.push(k);
if(KW.CONFIG.LOCAL_MODE){try{const r=await KW.api.checkAnswer(id,i,k);if(r.correct){correct++;bs[k].classList.add('correct')}else{bs[k].classList.add('wrong');bs[r.correctIndex].classList.add('correct')}score.textContent=Math.round(correct*quiz.xp/quiz.questions.length)+' XP';quizMsg.textContent=r.correct?'إجابة صحيحة — كمل!':'مش دي. راجع الفكرة وكمل.';setTimeout(()=>{i++;quizMsg.textContent='';render()},650)}catch(e){quizMsg.textContent=e.message;bs.forEach(z=>z.disabled=false);picked.pop()}return}
bs[k].classList.add('selected');quizMsg.textContent='تم اختيار الإجابة. هتعرف نتيجتك بعد تسليم الكويز.';setTimeout(()=>{i++;quizMsg.textContent='';render()},350)}
async function finish(){const n=quiz.questions.length;question.textContent='خلصت الكويز 🎉';qCount.textContent='تم';qBar.style.width='100%';answers.innerHTML='<div class="card"><p class="muted">جاري تجهيز النتيجة…</p></div>';let note='سجّل دخولك عشان نتحقق من إجاباتك ونسجل النتيجة والـXP في حسابك.';
if(KW.user){try{const r=await KW.api.submitQuiz(id,picked);correct=r.score;note='تم حفظ نتيجتك وإضافة '+(+r.xp)+' XP لحسابك.'}catch(e){note='ما قدرناش نتحقق من النتيجة أو نحفظها: '+e.message}}
answers.innerHTML=`<div class="card"><h3>${KW.user?'نتيجتك: '+correct+' / '+n:'الكويز اكتمل'}</h3><p>${E(note)}</p>${!KW.user?'<a class="btn btn-primary" href="login.html?next='+encodeURIComponent('quiz.html?id='+id)+'">سجّل دخولك</a> ':''}<a class="btn btn-soft" href="quizzes.html">رجوع للكويزات</a></div>`}</script></body></html>
