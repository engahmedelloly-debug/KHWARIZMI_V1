<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="لوحة تحكم رحلتك التعليمية على خوارزمي."></head><body><div id="siteHeader"></div><main class="page"><div class="wrap"><div class="page-title"><h1 id="hello">لوحة التحكم</h1><p>كل اللي يخص رحلتك التعليمية في مكان واحد.</p></div><div id="dash"></div></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const E=KW.esc,hello=document.getElementById('hello'),dash=document.getElementById('dash');if(KW.requireAuth()){hello.textContent='أهلاً يا '+KW.user.name+' 👋';
KW.view(dash,()=>KW.api.getSummary(),s=>{const p=s.currentPath,st=(n,l)=>`<div class="stat"><div class="num">${n}</div><div class="label">${l}</div></div>`;
return `<div class="stats">${st(+s.xp,'XP')+st('Lv. '+(+s.level),'المستوى')+st((+s.streak)+' 🔥','Streak')+st(+s.quizzesDone,'كويز مكتمل')}</div><section class="section" style="border:0;padding:35px 0"><div class="grid"><article class="card"><h3>مسارك الحالي</h3>${p?`<p>${E(p.title)}</p><div class="progress" style="margin:15px 0 8px"><span style="width:${+p.progress||0}%"></span></div><span class="small muted">${+p.progress||0}% مكتمل</span><br><a class="btn btn-soft small" href="path.html?id=${encodeURIComponent(p.id)}" style="margin-top:12px">كمل المسار</a>`:`<p class="muted">لسه ما بدأتش مسار.</p><a class="btn btn-soft small" href="paths.html" style="margin-top:12px">اختار مسار</a>`}</article><article class="card"><h3>التحدي اليومي</h3><p>حل كويز واحد وخد XP.</p><a class="btn btn-primary small" href="quizzes.html" style="margin-top:12px">ابدأ التحدي</a></article><article class="card"><h3>آخر نشاط</h3><p>${s.recent&&s.recent[0]?E(s.recent[0].text):'لسه مفيش نشاط.'}</p><a class="btn btn-ghost small" href="profile.html" style="margin-top:12px">شوف نشاطك</a></article></div></section>`})}</script></body></html>
