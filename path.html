<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المسار — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="خريطة طريق مسار تعليمي على خوارزمي."></head><body><div id="siteHeader"></div><main class="page"><div class="wrap" id="pathPage"></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/roadmaps.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const E=KW.esc,pathPage=document.getElementById('pathPage'),id=new URLSearchParams(location.search).get('id');let data,lang='all';
const KIND={course:'كورس',docs:'توثيق',video:'فيديو',book:'كتاب',practice:'تمرين',tool:'أداة',list:'قايمة',roadmap:'خريطة'};
const url=u=>/^https?:\/\//i.test(u)?u:'#';
const res=r=>`<li class="res"><a href="${E(url(r.url))}" target="_blank" rel="noopener noreferrer"><span class="res-t">${E(r.title)}</span><span class="res-d">${E(r.desc)}</span></a><span class="res-tags"><span class="lang-badge ${r.lang==='ar'?'ar':'en'}">${r.lang==='ar'?'AR':'EN'}</span><span class="tag">${E(KIND[r.type]||r.type)}</span></span></li>`;
const q=t=>`https://www.youtube.com/results?search_query=${encodeURIComponent(t+' شرح بالعربي')}`;
const list=(l,t)=>{const f=(l||[]).filter(r=>lang==='all'||r.lang===lang);let h=f.map(res).join('');if(t&&lang!=='en')h+=`<li class="res res-search"><a href="${q(t)}" target="_blank" rel="noopener noreferrer"><span class="res-t">شروحات عربية عن «${E(t)}»</span><span class="res-d">بحث جاهز في يوتيوب</span></a><span class="res-tags"><span class="lang-badge ar">AR</span><span class="tag">بحث</span></span></li>`;return h||`<li class="res-empty small muted">No English resources here.</li>`};
const stages=()=>{const n=data.roadmap.length,cur=Math.min(n-1,Math.floor((+data.progress||0)/100*n));return data.roadmap.map((s,i)=>`<article class="road-node rich ${s.completed?'done':i===cur?'current':''}"><div class="road-dot">${s.completed?'✓':i+1}</div><div class="road-body"><h3>${E(s.title)}</h3><p>${E(s.desc)}</p><div class="road-meta"><span>⏱ ${E(s.duration)}</span>${s.project?`<span>🎯 ${E(s.project)}</span>`:''}</div><ul class="res-list">${list(s.resources,s.title)}</ul>${KW.user?`<div style="margin-top:14px"><button type="button" class="btn ${s.completed?'btn-soft':s.available?'btn-primary':'btn-soft'} small stage-complete" data-stage="${i}" ${s.completed||!s.available?'disabled':''}>${s.completed?'✓ تم إنجاز المرحلة':s.available?'أنجزت المرحلة':'🔒 ابدأ بالمرحلة السابقة'}</button></div>`:''}</div></article>`).join('')};
const chip=(k,t)=>`<button type="button" class="chip" data-lang="${k}" aria-pressed="${lang===k}">${t}</button>`;
KW.view(pathPage,()=>KW.api.getPath(id),p=>{data=p;const all=new Set(p.roadmap.flatMap(s=>s.resources.map(r=>r.url)).concat(p.resources.map(r=>r.url)));
return `<div class="page-title"><span class="tag accent">مسار تعليمي</span><h1>${E(p.title)}</h1><p>${E(p.desc)}</p></div><div class="stats"><div class="stat"><div class="num">${+p.progress||0}%</div><div class="label">تقدمك</div></div><div class="stat"><div class="num">${p.roadmap.length}</div><div class="label">مراحل</div></div><div class="stat"><div class="num">${E(p.level)}</div><div class="label">المستوى</div></div><div class="stat"><div class="num">${all.size}</div><div class="label">مصدر مجاني</div></div></div><section class="section" style="border:0;padding:30px 0 0"><div class="section-head"><div><h2>Roadmap</h2><p>ابدأ من أول مرحلة وامشِ بالترتيب. كل مرحلة ليها مشروع صغير تتأكد بيه إنك فهمت.</p></div></div><div class="chips" role="group" aria-label="لغة المصادر">${chip('all','كل المصادر')}${chip('ar','عربي')}${chip('en','English')}</div><div class="roadmap" id="stagesBox">${stages()}</div></section><section class="section" style="border:0;padding:30px 0 0"><div class="section-head"><div><h2>مصادر عربية عامة وخرائط إضافية</h2><p>قوائم ومنصات تغطي المسار كله. الروابط لمواقع خارجية مجانية وممكن تتغير مع الوقت.</p></div></div><ul class="res-list" id="moreBox">${list(p.resources)}</ul></section>`});
pathPage.addEventListener('click',async e=>{const chip=e.target.closest('[data-lang]');if(chip&&data){lang=chip.dataset.lang;pathPage.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===lang)));document.getElementById('stagesBox').innerHTML=stages();document.getElementById('moreBox').innerHTML=list(data.resources);return}const b=e.target.closest('[data-stage]');if(!b||!data||b.disabled)return;const i=Number(b.dataset.stage);b.disabled=true;b.textContent='جاري الحفظ…';try{const r=await KW.api.completeStage(id,i);data.progress=r.progress;data.roadmap[i].completed=true;document.getElementById('stagesBox').innerHTML=stages();document.querySelector('.stats .stat .num').textContent=(+r.progress||0)+'%';}catch(err){b.disabled=false;b.textContent='أنجزت المرحلة';alert(err.message)}})</script></body></html>
