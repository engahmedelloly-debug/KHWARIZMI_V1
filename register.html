<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب — خوارزمي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="css/app.css"><link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml"><meta name="description" content="أنشئ حسابك على خوارزمي."></head><body><div id="siteHeader"></div><main class="auth-wrap"><div class="auth-card"><h1>ابدأ مع خوارزمي</h1><p class="sub">حسابك هيكون نقطة البداية لكل تقدمك وXP.</p><form id="registerForm" class="form-grid"><div class="field"><label>الاسم</label><input class="input" id="name" required placeholder="اسمك"></div><div class="field"><label>البريد الإلكتروني</label><input class="input" id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>كلمة المرور</label><input class="input" id="password" type="password" minlength="6" required placeholder="6 حروف على الأقل"></div><div id="msg" class="form-msg"></div><button class="btn btn-primary" type="submit">إنشاء الحساب</button></form><div class="auth-footer">عندك حساب بالفعل؟ <a href="login.html" style="color:var(--accent)">سجّل دخول</a></div></div></main><div id="siteFooter"></div><script src="js/layout.js"></script><script src="js/app.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/mock.js"></script><script src="js/api.js"></script><script src="js/render.js"></script><script>const registerForm=document.getElementById('registerForm'),msg=document.getElementById('msg');registerForm.onsubmit=async e=>{e.preventDefault();const b=registerForm.querySelector('button'),g=x=>document.getElementById(x).value;b.disabled=true;msg.textContent='';
try{await KW.api.register({name:g('name').trim(),email:g('email').trim(),password:g('password')});location.href='dashboard.html'}catch(err){msg.textContent=err.message;b.disabled=false}}</script></body></html>
